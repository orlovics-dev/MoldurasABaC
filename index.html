<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Molduras ABaC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061b2e;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center}
main{width:min(100%,520px);padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:21px;margin:0}.tag{font-size:11px;color:#c8d8e6}.msg{padding:20px;border:1px solid #ffffff25;border-radius:16px;background:#ffffff0d;text-align:center;line-height:1.45}
#app{display:none}.stage{position:relative;width:100%;aspect-ratio:9/16;background:#000;border-radius:20px;overflow:hidden}
video,#still,#mask{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video.mirror{transform:scaleX(-1)}
#still{display:none}#mask{z-index:5;object-fit:fill;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
button,.filelabel{border:0;border-radius:13px;padding:13px;font-weight:bold;text-align:center;background:white;color:#08233b;font-size:14px;cursor:pointer}
.primary{background:#12bdf2}.yellow{background:#ffd400}.dark{background:#ffffff18;color:white;border:1px solid #ffffff25}.wide{grid-column:1/-1}
input[type=file]{display:none}.hint{font-size:12px;color:#b7c8d8;text-align:center;line-height:1.4}
</style></head>
<body><main>
<div class="head"><h1>Molduras ABaC</h1><span class="tag">Associação Bahia Central</span></div>
<div id="message" class="msg"><b>Acesse pelo QR Code</b><br>É necessário um código válido de moldura.</div>
<section id="app">
<div class="stage"><video id="video" autoplay muted playsinline></video><img id="still"><img id="mask"></div>
<div class="grid">
<button id="switch" class="dark">Trocar câmera</button>
<button id="shot" class="primary">Tirar foto</button>
<label class="filelabel wide" for="gallery">Ou escolher foto da galeria</label><input id="gallery" type="file" accept="image/*">
<button id="again" class="dark" style="display:none">Refazer</button>
<button id="share" class="yellow" style="display:none">Compartilhar</button>
<button id="save" class="wide" style="display:none">Salvar imagem</button>
</div>
<p class="hint" id="status">Aguardando câmera…</p>
</section>
<canvas id="canvas" width="1080" height="1920" hidden></canvas>
<script>
const $=id=>document.getElementById(id), q=new URLSearchParams(location.search);
let stream=null,facing="user",blob=null,frame=null,ready=false;
const video=$("video"),mask=$("mask"),still=$("still"),canvas=$("canvas"),status=$("status");

async function init(){
 try{
  let r=await fetch("./frames.json?v="+Date.now()); if(!r.ok) throw Error("frames");
  let data=await r.json();
  frame=data.frames.find(x=>x.id===q.get("f")&&x.token===q.get("k")&&x.active);
  if(!frame){$("message").innerHTML="<b>Moldura não encontrada.</b><br>Leia novamente o QR Code oficial.";return}
  mask.src="./"+frame.image+"?v="+Date.now();
  await new Promise((ok,no)=>{mask.onload=ok;mask.onerror=no});
  $("message").style.display="none";$("app").style.display="block";
  await camera();
 }catch(e){$("message").innerHTML="<b>Erro ao carregar a moldura.</b><br>Atualize a página ou leia novamente o QR Code."}
}
async function camera(){
 ready=false;status.textContent="Abrindo câmera…";
 if(stream)stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});
  video.srcObject=stream; video.className=facing==="user"?"mirror":"";
  await video.play();
  if(video.readyState<2) await new Promise(ok=>video.onloadeddata=ok);
  ready=true;status.textContent="Câmera pronta.";
 }catch(e){status.textContent="Não foi possível abrir a câmera. Use “escolher foto da galeria” ou verifique a permissão do navegador."}
}
function crop(sw,sh,dw,dh){let sr=sw/sh,dr=dw/dh,sx=0,sy=0,w=sw,h=sh;if(sr>dr){w=sh*dr;sx=(sw-w)/2}else{h=sw/dr;sy=(sh-h)/2}return [sx,sy,w,h]}
async function compose(source,sw,sh,mirror=false){
 let ctx=canvas.getContext("2d");ctx.clearRect(0,0,1080,1920);let c=crop(sw,sh,1080,1920);
 ctx.save();if(mirror){ctx.translate(1080,0);ctx.scale(-1,1)}
 ctx.drawImage(source,...c,0,0,1080,1920);ctx.restore();ctx.drawImage(mask,0,0,1080,1920);
 blob=await new Promise(ok=>canvas.toBlob(ok,"image/png",1));showResult(URL.createObjectURL(blob));
}
function showResult(url){still.src=url;still.style.display="block";video.style.display="none";$("shot").style.display="none";$("switch").style.display="none";document.querySelector(".filelabel").style.display="none";$("again").style.display="block";$("share").style.display="block";$("save").style.display="block";status.textContent="Imagem pronta."}
$("shot").onclick=()=>{if(!ready||!video.videoWidth){status.textContent="A câmera ainda não está pronta.";return}compose(video,video.videoWidth,video.videoHeight,facing==="user")};
$("switch").onclick=async()=>{facing=facing==="user"?"environment":"user";await camera()};
$("gallery").onchange=e=>{let f=e.target.files[0];if(!f)return;let img=new Image();img.onload=()=>compose(img,img.naturalWidth,img.naturalHeight,false);img.src=URL.createObjectURL(f)};
$("again").onclick=()=>{blob=null;still.style.display="none";video.style.display="block";$("shot").style.display="block";$("switch").style.display="block";document.querySelector(".filelabel").style.display="block";$("again").style.display="none";$("share").style.display="none";$("save").style.display="none";status.textContent=ready?"Câmera pronta.":"Aguardando câmera…"};
$("save").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Moldura-ABaC.png";a.click()};
$("share").onclick=async()=>{let f=new File([blob],"Moldura-ABaC.png",{type:"image/png"});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:frame.name});else $("save").click()}catch(e){}};
init();
</script></main></body></html>
